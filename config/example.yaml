# Example cm1analysis configuration.
#
# Copy this file to config/local/<name>.yaml (gitignored) and edit the copy.
# Paths may use ~ and environment variables; relative paths are taken from
# this file's directory. Unknown keys are reported as errors.

# Where figures are written. Each plot category writes to its own subdirectory.
output_dir: $CM1_IMAGES

# CM1 output files inside each run directory.
file_pattern: "cm1out_*.nc"

dpi: 200

# Font sizes in points (optional; any key left out uses the default).
# Keys: title, suptitle, axis_label, tick, cbar_label, cbar_tick, legend, contour_label
fonts:
  title: 17
  tick: 10

# Experiment groups for multi-run plots (timeseries, statistics, comparisons).
# Each run is a directory of CM1 output. color and marker are matplotlib values;
# label (optional) replaces the run name in legends.
experiments:
  control:
    control: {path: $CM1_DATA/control, color: k, marker: "*"}

  lapse_rate:
    LR82: {path: $CM1_DATA/lapse_rate/lr_82, color: red, marker: "*", label: "8.2 K/km"}
    LR80: {path: $CM1_DATA/lapse_rate/lr_80, color: magenta, marker: "*", label: "8.0 K/km"}
    LR78: {path: $CM1_DATA/lapse_rate/lr_78, color: tomato, marker: "*", label: "7.8 K/km"}

# Run that comparison plots difference against, written "group/run".
reference: control/control

# Per-category plot options. Inside a category, a key naming a plot holds that
# plot's options; other keys apply to every plot in the category.
# `cm1plot list --category planar` shows each plot's options and defaults.
plots:
  planar:
    extent_km: [800, 1400, 450, 1100]   # [xmin, xmax, ymin, ymax]; omit for the full domain
    thpert: {heights_km: [0, 1, 3]}       # 0 = lowest model level; one figure per height
    prspert: {heights_km: [0, 1, 3, 5]}
    wind_swath: {refl_dbz: 45.0, interval_s: 7200}
    compare: {rows: [cref, cpc, wind_swath]}
  cross_section:
    window_km: 100.0          # section length; most of it behind the gust front
    trailing_fraction: 0.75   # share of the window behind (west of) the gust front
    # y_km: 750.0             # pin the section row; omit to follow the bow apex
    average_km: 40.0          # average each section across the line (Mahoney and Lackmann 2011); 0 = one row
    # storm_u: 24.0           # c_x in m/s; omit to estimate it from the leading edge's motion
    leading_edge: cold_pool   # edge tracked for c_x: cold_pool, or reflectivity (>= edge_dbz, their 40 dBZ)
    motion_window_s: 3600     # c_x is a line fit to the edge position over this window (theirs: 1 h)
    cmt_section: {average_s: 1800}   # budget profiles averaged over 30 min, as in Mahoney et al. (2009)
